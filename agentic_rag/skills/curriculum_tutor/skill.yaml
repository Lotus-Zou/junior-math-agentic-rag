id: math.curriculum_tutor
version: 1.0.0
description: "Use an LLM Tutor Agent and independent Critic to explain a deterministic mathematics baseline."
input_schema: agentic_rag.domain.schemas.CurriculumTutorInput
output_schema: agentic_rag.domain.schemas.CurriculumSolveOutput
handler: agentic_rag.skills.curriculum_tutor.handler.handle
timeout_ms: 100000
max_attempts: 1
idempotent: true
side_effects: []
required_capabilities: [llm, critic]
dependencies: [math.curriculum_solve@1]
fallback: deterministic_verified_baseline
policies: [junior_math_scope]
evaluator: curriculum_tutor_v1
expose:
  langchain: false
  mcp: false
