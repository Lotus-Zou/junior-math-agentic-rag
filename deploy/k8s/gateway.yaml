apiVersion: apps/v1
kind: Deployment
metadata: {name: math-agent-gateway, namespace: math-agent}
spec:
  replicas: 3
  selector: {matchLabels: {app: math-agent-gateway}}
  template:
    metadata: {labels: {app: math-agent-gateway}}
    spec:
      containers:
        - name: gateway
          image: math-agent-gateway:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          env:
            - {name: AI_PROTOCOL, value: grpc}
            - {name: AI_UPSTREAM, value: http://math-agent-ai:8000}
            - {name: AI_GRPC_TARGET, value: math-agent-grpc:50051}
            - {name: GATEWAY_REDIS_URL, value: redis://math-agent-redis:6379/1}
            - {name: REQUIRE_USER_IDENTITY, value: "true"}
            - {name: AUTH_BROWSER_SESSIONS, value: "true"}
            - {name: AUTH_COOKIE_SECURE, value: "true"}
          envFrom: [{secretRef: {name: math-agent-secrets}}]
          readinessProbe: {httpGet: {path: /ready, port: 8080}}
          livenessProbe: {httpGet: {path: /health, port: 8080}}
          resources: {requests: {cpu: "100m", memory: "128Mi"}, limits: {cpu: "1", memory: "512Mi"}}
---
apiVersion: v1
kind: Service
metadata: {name: math-agent-gateway, namespace: math-agent}
spec: {type: LoadBalancer, selector: {app: math-agent-gateway}, ports: [{port: 80, targetPort: 8080}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: math-agent-gateway, namespace: math-agent}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: math-agent-gateway}
  minReplicas: 3
  maxReplicas: 20
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: math-agent-gateway, namespace: math-agent}
spec: {minAvailable: 2, selector: {matchLabels: {app: math-agent-gateway}}}
