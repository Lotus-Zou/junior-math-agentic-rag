apiVersion: v1
kind: Namespace
metadata: {name: monitoring}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: math-agent-prometheus, namespace: monitoring}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: math-agent-prometheus}
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: math-agent-prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: math-agent-prometheus}
subjects: [{kind: ServiceAccount, name: math-agent-prometheus, namespace: monitoring}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: math-agent-prometheus, namespace: monitoring}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      - job_name: vllm
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [math-agent]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: math-agent-model
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
        # Preserve vLLM's colon-separated names for adapter series discovery.
        metric_name_validation_scheme: legacy
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: math-agent-prometheus, namespace: monitoring}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: math-agent-prometheus}}
  template:
    metadata: {labels: {app: math-agent-prometheus}}
    spec:
      serviceAccountName: math-agent-prometheus
      securityContext: {runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534}
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --storage.tsdb.retention.size=8GB
          ports: [{name: http, containerPort: 9090}]
          readinessProbe: {httpGet: {path: /-/ready, port: http}}
          livenessProbe: {httpGet: {path: /-/healthy, port: http}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 2Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: math-agent-prometheus}
        - name: data
          persistentVolumeClaim: {claimName: math-agent-prometheus}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: math-agent-prometheus, namespace: monitoring}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: math-agent-prometheus, namespace: monitoring}
spec:
  selector: {app: math-agent-prometheus}
  ports: [{name: http, port: 9090, targetPort: http}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: math-agent-prometheus-adapter, namespace: monitoring}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: math-agent-prometheus-adapter}
rules:
  - apiGroups: [""]
    resources: [pods, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: math-agent-prometheus-adapter}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: math-agent-prometheus-adapter}
subjects: [{kind: ServiceAccount, name: math-agent-prometheus-adapter, namespace: monitoring}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: math-agent-prometheus-adapter:system:auth-delegator}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:auth-delegator}
subjects: [{kind: ServiceAccount, name: math-agent-prometheus-adapter, namespace: monitoring}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: math-agent-prometheus-adapter-auth-reader, namespace: kube-system}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: extension-apiserver-authentication-reader}
subjects: [{kind: ServiceAccount, name: math-agent-prometheus-adapter, namespace: monitoring}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: math-agent-prometheus-adapter, namespace: monitoring}
data:
  config.yaml: |
    rules:
      - seriesQuery: 'vllm:num_requests_waiting{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: namespace}
            pod: {resource: pod}
        name:
          matches: '^vllm:num_requests_waiting$'
          as: vllm_num_requests_waiting
        metricsQuery: 'sum(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
      - seriesQuery: 'vllm:num_requests_running{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace: {resource: namespace}
            pod: {resource: pod}
        name:
          matches: '^vllm:num_requests_running$'
          as: vllm_num_requests_running
        metricsQuery: 'sum(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: math-agent-prometheus-adapter, namespace: monitoring}
spec:
  replicas: 1
  selector: {matchLabels: {app: math-agent-prometheus-adapter}}
  template:
    metadata: {labels: {app: math-agent-prometheus-adapter}}
    spec:
      serviceAccountName: math-agent-prometheus-adapter
      containers:
        - name: adapter
          image: registry.k8s.io/prometheus-adapter/prometheus-adapter@sha256:932eae60e2bcf9c4660d6442da066ef1a79b4ea7cc232c61c7303069216ca006
          args:
            - --secure-port=6443
            - --tls-cert-file=/certs/tls.crt
            - --tls-private-key-file=/certs/tls.key
            - --prometheus-url=http://math-agent-prometheus.monitoring.svc:9090
            - --config=/etc/adapter/config.yaml
            - --metrics-relist-interval=30s
            - --metrics-max-age=2m
          ports: [{name: https, containerPort: 6443}]
          readinessProbe: {httpGet: {path: /readyz, port: https, scheme: HTTPS}, initialDelaySeconds: 30}
          livenessProbe: {httpGet: {path: /livez, port: https, scheme: HTTPS}, initialDelaySeconds: 30}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/adapter, readOnly: true}
            - {name: certs, mountPath: /certs, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: math-agent-prometheus-adapter}
        - name: certs
          secret: {secretName: math-agent-prometheus-adapter-tls}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: {name: math-agent-prometheus-adapter, namespace: monitoring}
spec:
  selector: {app: math-agent-prometheus-adapter}
  ports: [{port: 443, targetPort: https}]
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata: {name: v1beta1.custom.metrics.k8s.io}
spec:
  group: custom.metrics.k8s.io
  version: v1beta1
  groupPriorityMinimum: 100
  versionPriority: 100
  service: {name: math-agent-prometheus-adapter, namespace: monitoring}
