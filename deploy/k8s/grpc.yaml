apiVersion: apps/v1
kind: Deployment
metadata: {name: math-agent-grpc, namespace: math-agent}
spec:
  replicas: 2
  selector: {matchLabels: {app: math-agent-grpc}}
  template:
    metadata: {labels: {app: math-agent-grpc}}
    spec:
      containers:
        - name: grpc
          image: math-agent-ai:local
          imagePullPolicy: IfNotPresent
          command: ["python", "grpc_server.py"]
          ports: [{containerPort: 50051, name: grpc}]
          envFrom: [{secretRef: {name: math-agent-secrets}}]
          env:
            - {name: HF_HOME, value: /app/chroma_db/model-cache}
            - {name: GRPC_PORT, value: "50051"}
            - {name: REQUIRE_USER_IDENTITY, value: "true"}
            - {name: OPENAI_API_BASE, value: http://math-agent-model:8000/v1}
            - {name: MODEL_PROVIDER, value: custom}
            - {name: MODEL_WIRE_API, value: chat_completions}
            - {name: LLM_MODEL_NAME, value: math-agent}
            - {name: CRITIC_MODEL_NAME, value: math-agent}
            - {name: RERANK_MODEL_NAME, value: math-agent}
            - {name: AI_MAX_INFLIGHT, value: "8"}
            - {name: AI_QUEUE_MAXSIZE, value: "32"}
            - {name: TASK_QUEUE_CAPACITY, value: "10000"}
          volumeMounts:
            - {name: traces, mountPath: /app/traces}
            - {name: chroma, mountPath: /app/chroma_db}
          readinessProbe: {grpc: {port: 50051, service: readiness}, initialDelaySeconds: 15, periodSeconds: 10}
          livenessProbe: {grpc: {port: 50051}, initialDelaySeconds: 30, periodSeconds: 15}
          resources: {requests: {cpu: "500m", memory: "1Gi"}, limits: {cpu: "2", memory: "4Gi"}}
      volumes:
        - {name: traces, persistentVolumeClaim: {claimName: math-agent-traces}}
        - {name: chroma, persistentVolumeClaim: {claimName: math-agent-chroma}}
---
apiVersion: v1
kind: Service
metadata: {name: math-agent-grpc, namespace: math-agent}
spec: {selector: {app: math-agent-grpc}, ports: [{name: grpc, port: 50051, targetPort: grpc}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: math-agent-grpc, namespace: math-agent}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: math-agent-grpc}
  minReplicas: 2
  maxReplicas: 12
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}}]
