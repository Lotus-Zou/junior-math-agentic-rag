apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - gpu-system
  - model-inference.yaml
  - dependencies.yaml
  - index-job.yaml
  - app.yaml
  - grpc.yaml
  - worker.yaml
  - gateway.yaml
  - ingress.yaml
configMapGenerator:
  - name: math-agent-model-artifacts
    namespace: math-agent
    files:
      - model-artifacts/download.py
      - model-artifacts/manifest.json
