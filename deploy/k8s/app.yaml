apiVersion: apps/v1
kind: Deployment
metadata: {name: math-agent-ai, namespace: math-agent}
spec:
  replicas: 2
  selector: {matchLabels: {app: math-agent-ai}}
  template:
    metadata: {labels: {app: math-agent-ai}}
    spec:
      containers:
        - name: app
          image: your-registry/math-agent-ai:latest
          ports: [{containerPort: 8000}]
          envFrom: [{secretRef: {name: math-agent-secrets}}]
          readinessProbe: {httpGet: {path: /ready, port: 8000}, initialDelaySeconds: 10, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 20, periodSeconds: 15}
          resources: {requests: {cpu: "500m", memory: "1Gi"}, limits: {cpu: "2", memory: "4Gi"}}
---
apiVersion: v1
kind: Service
metadata: {name: math-agent-ai, namespace: math-agent}
spec: {selector: {app: math-agent-ai}, ports: [{port: 8000, targetPort: 8000}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: math-agent-ai, namespace: math-agent}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: math-agent-ai}
  minReplicas: 2
  maxReplicas: 12
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}}]
