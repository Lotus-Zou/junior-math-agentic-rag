apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: math-agent-gateway
  namespace: math-agent
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "240"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "240"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [math-agent.example.com]
      secretName: math-agent-tls
  rules:
    - host: math-agent.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: math-agent-gateway, port: {number: 80}}}
