apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../k8s]
patches:
  - target: {kind: Deployment, name: math-agent-ai}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: {kind: Deployment, name: math-agent-grpc}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: {kind: Deployment, name: math-agent-worker}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: {kind: Deployment, name: math-agent-gateway}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: {kind: PersistentVolumeClaim, name: math-agent-traces}
    patch: |-
      - op: replace
        path: /spec/accessModes
        value: [ReadWriteOnce]
  - target: {kind: PersistentVolumeClaim, name: math-agent-chroma}
    patch: |-
      - op: replace
        path: /spec/accessModes
        value: [ReadWriteOnce]
  - target: {kind: Deployment, name: math-agent-model}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  - target: {kind: HorizontalPodAutoscaler, name: math-agent-model}
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1
  - target: {kind: PodDisruptionBudget, name: math-agent-model}
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 0
  - target: {kind: PersistentVolumeClaim, name: math-agent-model-cache}
    patch: |-
      - op: replace
        path: /spec/accessModes
        value: [ReadWriteOnce]
  # Local k3s only: production must provide CA-signed kubelet serving certs.
  - target: {kind: Deployment, name: metrics-server}
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/args/5
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kubelet-insecure-tls
